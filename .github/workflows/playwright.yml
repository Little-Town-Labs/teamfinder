name: Playwright Tests
on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request: null
  workflow_dispatch: null
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      SKIP_ENV_VALIDATION: true
      DATABASE_URL: postgresql://teamfinder:teamfinder@localhost:5432/teamfinder
      CLERK_SECRET_KEY: sk_test_ci
      CLERK_WEBHOOK_SECRET: whsec_ci
      RESEND_API_KEY: re_ci_placeholder
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZGV2ZWxvcGVyLmNsZXJrLmFjY291bnRzLmRldiQ
      NEXT_PUBLIC_MAPBOX_TOKEN: pk.ci
      SKIP_DATABASE_SETTINGS: true
      SKIP_CLERK_AUTH: true
    steps:
      - uses: actions/checkout@v4
      - run: echo "node_version=$(cat .github/nodejs.version)" >> $GITHUB_ENV
      - name: "use node ${{ env.node_version }}"
        uses: actions/setup-node@v3
        with:
          node-version: "${{ env.node_version }}"

      - name: "Install pnpm & dependencies"
        uses: pnpm/action-setup@v4
        with:
          run_install: |
            - recursive: true
            - args: [--frozen-lockfile]

      - name: Install Playwright Browsers
        run: pnpm playwright install --with-deps

      - name: Run Playwright tests
        run: pnpm playwright test

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
